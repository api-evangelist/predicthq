aid: predicthq
name: PredictHQ
description: >-
  PredictHQ is an AI-powered demand intelligence platform that predicts the impact of real-world events on business
  demand. The PredictHQ API delivers structured, deduplicated event data, machine learning features, demand forecasts,
  and impact analytics across categories such as concerts, sports, conferences, public holidays, school terms, severe
  weather, and more, helping enterprises make smarter decisions about staffing, inventory, pricing, and marketing.
