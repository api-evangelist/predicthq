naftiko: 1.0.0-alpha2
info:
  label: PredictHQ API
  description: 'PredictHQ API. 5 operations. Lead operation: Search Events. Self-contained Naftiko capability covering one
    Predicthq business surface.'
  tags:
  - Predicthq
  - PredictHQ API
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PREDICTHQ_API_KEY: PREDICTHQ_API_KEY
capability:
  consumes:
  - type: http
    namespace: predicthq
    baseUri: https://api.predicthq.com/v1
    description: PredictHQ API business capability. Self-contained, no shared references.
    resources:
    - name: events
      path: /events/
      operations:
      - name: searchevents
        method: GET
        description: Search Events
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: events-count
      path: /events/count/
      operations:
      - name: geteventcounts
        method: GET
        description: Get Event Counts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: features
      path: /features/
      operations:
      - name: getfeatures
        method: POST
        description: Get ML Features
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: places
      path: /places/
      operations:
      - name: getplaces
        method: GET
        description: Get Place Hierarchies
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: suggested-radius
      path: /suggested-radius/
      operations:
      - name: getsuggestedradius
        method: GET
        description: Get Suggested Radius
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.PREDICTHQ_API_KEY}}'
  exposes:
  - type: rest
    namespace: predicthq-rest
    port: 8080
    description: REST adapter for PredictHQ API. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/events
      name: events
      description: REST surface for events.
      operations:
      - method: GET
        name: searchevents
        description: Search Events
        call: predicthq.searchevents
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/events/count
      name: events-count
      description: REST surface for events-count.
      operations:
      - method: GET
        name: geteventcounts
        description: Get Event Counts
        call: predicthq.geteventcounts
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/features
      name: features
      description: REST surface for features.
      operations:
      - method: POST
        name: getfeatures
        description: Get ML Features
        call: predicthq.getfeatures
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/places
      name: places
      description: REST surface for places.
      operations:
      - method: GET
        name: getplaces
        description: Get Place Hierarchies
        call: predicthq.getplaces
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/suggested-radius
      name: suggested-radius
      description: REST surface for suggested-radius.
      operations:
      - method: GET
        name: getsuggestedradius
        description: Get Suggested Radius
        call: predicthq.getsuggestedradius
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: predicthq-mcp
    port: 9090
    transport: http
    description: MCP adapter for PredictHQ API. One tool per consumed operation, routed inline through this capability's consumes
      block.
    tools:
    - name: search-events
      description: Search Events
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: predicthq.searchevents
      outputParameters:
      - type: object
        mapping: $.
    - name: get-event-counts
      description: Get Event Counts
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: predicthq.geteventcounts
      outputParameters:
      - type: object
        mapping: $.
    - name: get-ml-features
      description: Get ML Features
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: predicthq.getfeatures
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-place-hierarchies
      description: Get Place Hierarchies
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: predicthq.getplaces
      outputParameters:
      - type: object
        mapping: $.
    - name: get-suggested-radius
      description: Get Suggested Radius
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: predicthq.getsuggestedradius
      outputParameters:
      - type: object
        mapping: $.
